<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام الموارد البشرية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1220;--panel:#141b2d;--panel2:#1b2439;--line:#27324c;--tx:#e9edf7;--mut:#8f9bb8;--acc:#f0b44c;--acc-tx:#1a1305;--ok:#4fc4a8;--bad:#ef6f7e;--warn:#f0b44c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@property --p{syntax:'<number>';inherits:false;initial-value:0}
:root[data-theme="light"]{--bg:#f3f5fa;--panel:#fff;--panel2:#eef1f8;--line:#d9dfec;--tx:#17203a;--mut:#5d6985;--acc:#b9770a;--acc-tx:#fff;--ok:#0f8f76;--bad:#c93a4c;--warn:#b9770a;color-scheme:light}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f5fa;--panel:#fff;--panel2:#eef1f8;--line:#d9dfec;--tx:#17203a;--mut:#5d6985;--acc:#b9770a;--acc-tx:#fff;--ok:#0f8f76;--bad:#c93a4c;--warn:#b9770a;color-scheme:light}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--panel);border-inline-end:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{font-weight:800;font-size:20px;padding:0 10px 18px}
.logo small{display:block;font-weight:400;color:var(--mut);font-size:12px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:none;border:0;padding:10px 12px;border-radius:10px;color:var(--mut);cursor:pointer;font-weight:600}
nav button:hover{background:var(--panel2);color:var(--tx)}
nav button.on{background:var(--acc);color:var(--acc-tx)}
main{padding:28px clamp(16px,3vw,40px);min-width:0}
h1{font-size:26px;margin:0 0 4px;font-weight:800}
.sub{color:var(--mut);margin:0 0 22px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.bar .sp{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;margin-bottom:14px}
.ring{--p:0;width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--panel2) 0);display:grid;place-items:center}
.ring div{width:118px;height:118px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center;font-size:30px;font-weight:800;line-height:1.1}
.ring small{display:block;font-size:12px;color:var(--mut);font-weight:400}
.stat b{display:block;font-size:26px;font-weight:800}
.stat span{color:var(--mut);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hb{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:14px}
.hb i{display:block;height:8px;border-radius:4px;background:var(--acc);min-width:4px}
.hb span:first-child{width:110px;color:var(--mut)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:11px 14px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:13px;background:var(--panel2)}
tr:last-child td{border-bottom:0}
.btn{background:var(--panel2);border:1px solid var(--line);padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--acc-tx);border-color:var(--acc)}
.btn.sm{padding:3px 10px;font-size:13px}
.btn.bad{color:var(--bad)}
.in{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 11px;min-width:0}
.in.num{width:100px}
aside{overflow-y:auto}
.hint{display:block;font-size:12px;margin-top:3px;color:var(--mut)}
.hint.ok{color:var(--ok)}.hint.warn{color:var(--warn)}.hint.bad{color:var(--bad)}
.tc{position:fixed;z-index:60;top:calc(14px + env(safe-area-inset-top,0px));inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;padding:0 12px}
.tt{pointer-events:auto;position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;min-width:min(340px,100%);max-width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 18px 40px -14px rgba(0,0,0,.55);animation:tti .35s cubic-bezier(.2,.8,.3,1.1)}
.tt.out{animation:tto .25s forwards}
@keyframes tti{from{opacity:0;transform:translateY(-16px) scale(.96)}}
@keyframes tto{to{opacity:0;transform:translateY(-10px) scale(.96)}}
.tt i{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.tt div{flex:1;min-width:0;line-height:1.35}.tt b{display:block;font-size:14px}.tt span{font-size:13px;color:var(--mut)}
.tt button{background:none;border:0;color:var(--mut);cursor:pointer;font-size:18px;line-height:1;padding:4px}
.tt .ua{color:var(--acc);font-weight:700;font-size:13px;text-decoration:underline;padding:4px 6px}
.tt u{position:absolute;inset-inline:0;bottom:0;height:3px;background:var(--c);transform-origin:right;animation:ttp var(--d,3.6s) linear forwards}
@keyframes ttp{to{transform:scaleX(0)}}
.tt.ok{--c:var(--ok)}.tt.bad{--c:var(--bad)}.tt.warn{--c:var(--warn)}.tt.info{--c:var(--acc)}
.cf{z-index:40}.cfm{text-align:center;width:min(400px,100%)}.cfm .act{justify-content:center}.cfm p{color:var(--mut);margin:6px 0 0}
.cfi{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:24px;margin:0 auto 10px;background:color-mix(in srgb,var(--acc) 18%,transparent)}
.cfi.bad{background:color-mix(in srgb,var(--bad) 18%,transparent)}
.btn.dng{background:var(--bad);border-color:var(--bad);color:#fff}
.in.err{border-color:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 22%,transparent)}
.xo{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.xo button{display:flex;flex-direction:column;gap:4px;text-align:start;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:border-color .2s,transform .2s}
.xo button:hover{border-color:var(--acc);transform:translateY(-2px)}
.xo button:disabled{opacity:.5;cursor:wait}
.xo span{font-size:12px;color:var(--mut)}
@media (max-width:520px){.xo{grid-template-columns:1fr}}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;background:var(--panel2)}
.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}.tag.warn{color:var(--warn)}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--panel2);color:var(--acc);font-weight:800;margin-inline-end:8px;vertical-align:middle}
.empty{padding:34px;text-align:center;color:var(--mut)}
.ov{position:fixed;inset:0;background:rgba(5,8,16,.65);display:grid;place-items:center;padding:16px;z-index:20}
.md{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(480px,100%);max-height:90vh;overflow:auto;padding:22px}
.md h2{margin:0 0 14px;font-size:19px}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fl label{display:block;font-size:13px;color:var(--mut)}
.fl label.w{grid-column:1/-1}
.fl .in{width:100%;margin-top:3px;color:var(--tx)}
.md .act{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--acc);color:var(--acc-tx);padding:9px 20px;border-radius:10px;font-weight:600;z-index:30}
body{background:radial-gradient(900px 420px at 88% -8%,color-mix(in srgb,var(--acc) 16%,transparent),transparent) fixed,var(--bg)}
body,aside,.card,.tw,.md,.col,.cd,.in,.btn{transition:background-color .3s,border-color .3s,color .3s}
aside{background:linear-gradient(180deg,var(--panel),var(--bg))}
nav button{transition:background-color .2s,color .2s,transform .2s}
nav button span{display:inline-block;width:22px;text-align:center}
nav button:hover{transform:translateX(-3px)}
nav button.on{box-shadow:0 8px 20px -8px var(--acc);font-weight:800}
.th{margin-top:auto;width:100%}
.pg{animation:pgin .5s cubic-bezier(.2,.7,.2,1)}
@keyframes pgin{from{opacity:0;transform:translateY(14px)}}
.ring{transition:--p 1.2s cubic-bezier(.2,.7,.2,1);box-shadow:0 0 40px -12px var(--acc)}
.hb i{transition:width 1s cubic-bezier(.2,.7,.2,1)}
.stat{padding:6px 4px}.stat b{font-size:32px;font-variant-numeric:tabular-nums}
.card{box-shadow:0 10px 30px -18px rgba(0,0,0,.5)}
.card.hero{background:linear-gradient(135deg,var(--panel),var(--panel2))}
tr:hover td{background:color-mix(in srgb,var(--panel2) 55%,transparent)}
.btn{transition:transform .15s,border-color .2s}.btn:active{transform:scale(.95)}
.ov{animation:fd .2s}@keyframes fd{from{opacity:0}}
.md{animation:pop .3s cubic-bezier(.2,.8,.3,1.15)}@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}}
.toast{animation:tin .3s}@keyframes tin{from{opacity:0;transform:translate(-50%,14px)}}
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:220px}
.col h3{margin:0 0 10px;font-size:14px;color:var(--mut)}
.cd{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;animation:pgin .35s}
.cd small{color:var(--mut);display:block}
.cd .r{display:flex;gap:4px;margin-top:8px;justify-content:space-between;flex-wrap:wrap}
.st{color:var(--acc);letter-spacing:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:820px){
.app{grid-template-columns:1fr}
aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px;border-inline-end:0;border-bottom:1px solid var(--line)}
.logo{display:none}nav{display:flex;gap:4px}nav button{white-space:nowrap}
.hero,.two{grid-template-columns:1fr}.fl{grid-template-columns:1fr}
}
/* ===== v3: نظام التصميم ===== */
:root{--r:14px;--tp:11px 14px;--cp:18px;--np:10px 12px;--ff:'Cairo'}
:root[data-rad="s"]{--r:6px}:root[data-rad="l"]{--r:24px}
:root[data-den="c"]{--tp:6px 12px;--cp:12px;--np:7px 12px}
:root[data-den="r"]{--tp:16px 18px;--cp:26px;--np:13px 14px}
:root[data-fs="s"]{--fs:13.5px}:root[data-fs="l"]{--fs:17px}
:root[data-fc="1"]{--fc:1}:root[data-fc="3"]{--fc:3}
:root[data-ac="blue"]{--acc:light-dark(oklch(.52 .2 258),oklch(.76 .14 250));--acc-tx:light-dark(#fff,#071225)}
:root[data-ac="emerald"]{--acc:light-dark(oklch(.5 .13 165),oklch(.78 .15 165));--acc-tx:light-dark(#fff,#04170f)}
:root[data-ac="violet"]{--acc:light-dark(oklch(.5 .2 295),oklch(.74 .15 295));--acc-tx:light-dark(#fff,#120a29)}
:root[data-ac="rose"]{--acc:light-dark(oklch(.52 .2 12),oklch(.76 .15 12));--acc-tx:light-dark(#fff,#2a0a12)}
:root[data-ac="cyan"]{--acc:light-dark(oklch(.52 .11 215),oklch(.8 .12 210));--acc-tx:light-dark(#fff,#03161a)}
:root[data-ac="orange"]{--acc:light-dark(oklch(.56 .16 50),oklch(.78 .15 55));--acc-tx:light-dark(#fff,#241203)}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
body{font-family:var(--ff),Cairo,Tahoma,sans-serif;font-size:var(--fs,15px);overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;opacity:.55;filter:blur(30px);background:radial-gradient(40% 35% at 20% 25%,color-mix(in srgb,var(--acc) 28%,transparent),transparent 70%),radial-gradient(35% 30% at 80% 20%,color-mix(in srgb,var(--ok) 18%,transparent),transparent 70%),radial-gradient(45% 40% at 60% 85%,color-mix(in srgb,#7c5cff 20%,transparent),transparent 70%)}
:root[data-theme="light"] body::before{opacity:.32}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) body::before{opacity:.32}}
h1{font-size:28px;letter-spacing:-.3px;background:linear-gradient(90deg,var(--tx),color-mix(in srgb,var(--acc) 70%,var(--tx)));-webkit-background-clip:text;background-clip:text;color:transparent}
.mw{min-width:0;display:flex;flex-direction:column}
main{flex:1;padding:24px clamp(16px,3vw,40px) 96px}
.pg{animation:none}
/* شريط علوي */
.tb{position:sticky;top:0;z-index:12;display:flex;align-items:center;gap:10px;padding:10px clamp(16px,3vw,40px);background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(16px) saturate(150%);border-bottom:1px solid var(--line)}
.tb .sp,.fr .sp{flex:1}
.bc{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px}.bc b{color:var(--tx);font-size:15px}.bc i{opacity:.5;font-style:normal}
.clk{text-align:end;line-height:1.25;padding-inline:8px}.clk b{display:block;font-size:15px;font-variant-numeric:tabular-nums}.clk small{color:var(--mut);font-size:11.5px}
.ib{position:relative;width:38px;height:38px;border-radius:calc(var(--r)*.7);border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:16px;display:grid;place-items:center;transition:transform .15s,border-color .2s}
.ib:hover{border-color:var(--acc);transform:translateY(-2px)}
.nb{font-style:normal;background:var(--bad);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:inline-grid;place-items:center;margin-inline-start:auto}
.ib .nb{position:absolute;top:-5px;inset-inline-end:-5px;margin:0}
/* القائمة */
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 14px}
.bm{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--acc-tx);background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 72%,var(--bg)));box-shadow:0 8px 22px -8px var(--acc)}
.brt b{display:block;font-size:15px;line-height:1.2}.brt small{color:var(--mut);font-size:11.5px}
.ng{font-size:11px;color:var(--mut);margin:14px 12px 4px;opacity:.85}
nav button{position:relative;gap:11px;padding:var(--np);border-radius:calc(var(--r)*.75)}
nav button.on{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 72%,var(--bg)));box-shadow:0 10px 24px -10px var(--acc)}
nav button.on::before{content:"";position:absolute;inset-inline-start:-14px;top:22%;bottom:22%;width:4px;border-radius:4px;background:var(--acc)}
.sbf{margin-top:auto;display:grid;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.sfu{display:flex;align-items:center;gap:10px}.sfu b{display:block;font-size:13px}.sfu small{color:var(--mut);font-size:11px}
.sfu .av{margin:0;width:36px;height:36px}.th{margin-top:0}
/* عام */
.card,.tw,.col,.kpi{border-radius:var(--r)}
.card{padding:var(--cp);position:relative;transition:transform .25s,box-shadow .25s,border-color .25s}
.btn,.in{border-radius:calc(var(--r)*.65)}
.md{border-radius:calc(var(--r)*1.3);box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.ov{backdrop-filter:blur(6px)}
th,td{padding:var(--tp)}
.tw{max-height:calc(100vh - 210px)}
th{position:sticky;top:0;z-index:2;font-size:12px;letter-spacing:.3px}
td:first-child{font-weight:600}
tr:hover td:first-child{box-shadow:inset -3px 0 var(--acc)}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid color-mix(in srgb,currentColor 25%,transparent);background:color-mix(in srgb,currentColor 12%,transparent)}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.btn.pri{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 76%,var(--bg)));border-color:transparent;position:relative;overflow:hidden;box-shadow:0 8px 20px -10px var(--acc)}
.fl{grid-template-columns:repeat(var(--fc,2),1fr)}
:root[data-fc="3"] .md:has(.fl){width:min(760px,100%)}
.fl label.w{grid-column:1/-1}
/* لوحة التحكم */
.dh{margin-bottom:18px}.dh h1{margin:0}.dh p{margin:0;color:var(--mut)}
.dg{display:grid;gap:14px;grid-template-columns:minmax(300px,1.1fr) 1.6fr;margin-bottom:14px}
.kg{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);padding:var(--cp);display:flex;flex-direction:column;gap:2px;transition:transform .25s,border-color .25s,box-shadow .25s}
.kpi::after{content:"";position:absolute;inset-inline-end:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(color-mix(in srgb,var(--c,var(--acc)) 30%,transparent),transparent 70%)}
.kpi:hover{transform:translateY(-4px);border-color:var(--c,var(--acc));box-shadow:0 18px 34px -18px var(--c,var(--acc))}
.ki{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;margin-bottom:8px;background:color-mix(in srgb,var(--c,var(--acc)) 16%,transparent)}
.kpi b{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}.kpi span{color:var(--mut);font-size:13px}
.k-ok{--c:var(--ok)}.k-bad{--c:var(--bad)}.k-warn{--c:var(--warn)}
.rc{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.spk{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:10px}
.spk div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.spk i{display:block;width:100%;height:0;min-height:4px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--acc),color-mix(in srgb,var(--acc) 30%,transparent));transition:height 1s cubic-bezier(.2,.7,.2,1)}
.spk small{font-size:11px;color:var(--mut)}.spk .off i{background:var(--line)}
/* حركة */
.st>*{animation:rise .65s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.985)}}
.st tr{animation:rrow .45s both;animation-delay:calc(var(--i,0)*35ms)}
@keyframes rrow{from{opacity:0;transform:translateX(18px)}}
:root[data-an="r"] body::before{animation:aur 26s ease-in-out infinite alternate}
@keyframes aur{to{transform:translate3d(-5%,4%,0) rotate(8deg) scale(1.15)}}
:root[data-an="r"] .btn.pri::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(120%);transition:transform .7s}
:root[data-an="r"] .btn.pri:hover::after{transform:translateX(-120%)}
:root[data-an="r"] .ki{animation:flt 4s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-4px) rotate(-4deg)}}
:root[data-an="r"] .ring{animation:rp 3.2s ease-in-out infinite}
@keyframes rp{50%{box-shadow:0 0 60px -6px var(--acc)}}
:root[data-an="r"] :is(.card,.col):hover{transform:translateY(-3px)}
:root[data-an="o"] *,:root[data-an="o"] *::before,:root[data-an="o"] *::after{animation:none!important;transition:none!important}
/* أنماط */
:root[data-sk="glass"]{--panel:light-dark(rgba(255,255,255,.7),rgba(255,255,255,.055));--panel2:light-dark(rgba(255,255,255,.55),rgba(255,255,255,.09));--line:light-dark(rgba(20,30,60,.12),rgba(255,255,255,.13))}
:root[data-sk="glass"] :is(.card,.tw,.col,.kpi,aside,.md,.ib,.xo button){backdrop-filter:blur(18px) saturate(150%)}
:root[data-sk="glass"] body::before{opacity:.9}
:root[data-sk="glass"] .in{background:light-dark(rgba(255,255,255,.6),rgba(255,255,255,.07))}
:root[data-sk="glass"] th{background:light-dark(#e9edf7,#1b2236)}
:root[data-sk="flat"] :is(.card,.tw,.col,.kpi,.md,.btn.pri){box-shadow:none}
:root[data-sk="flat"] body::before,:root[data-sk="flat"] .kpi::after{display:none}
:root[data-sk="flat"] aside{background:var(--panel)}
:root[data-sk="flat"] th{border-bottom:2px solid var(--acc);background:transparent}
:root[data-sk="flat"] :is(nav button.on,.btn.pri){background:var(--acc)}
:root[data-sk="soft"]{--line:color-mix(in srgb,var(--tx) 8%,transparent)}
:root[data-sk="soft"] :is(.card,.tw,.col,.kpi){border-color:transparent;box-shadow:0 14px 40px -22px rgba(0,0,0,.45)}
/* إعدادات المظهر */
.ug{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.us.wide{grid-column:1/-1}.uh{margin-bottom:12px}.uh b{display:block}.uh small{color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 16px;border-radius:calc(var(--r)*.65);border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:600;transition:all .2s}
.chip:hover{border-color:var(--acc)}.chip.on{background:var(--acc);color:var(--acc-tx);border-color:var(--acc);box-shadow:0 8px 18px -10px var(--acc)}
.sw{display:flex;flex-wrap:wrap;gap:12px}
.swb{width:38px;height:38px;border-radius:50%;border:3px solid var(--panel);background:var(--c);cursor:pointer;box-shadow:0 0 0 1px var(--line);transition:transform .2s}
.swb:hover{transform:scale(1.12)}.swb.on{box-shadow:0 0 0 3px var(--c);transform:scale(1.1)}
.skg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.skc{display:flex;flex-direction:column;gap:3px;text-align:start;padding:14px;border-radius:calc(var(--r)*.8);border:1px solid var(--line);background:var(--panel2);cursor:pointer;transition:all .2s}
.skc span{font-size:22px}.skc small{color:var(--mut);font-size:12px}
.skc:hover{transform:translateY(-2px);border-color:var(--acc)}.skc.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.fr{display:flex;align-items:center;gap:12px;padding:8px 10px;border:1px solid var(--line);border-radius:calc(var(--r)*.6);margin-bottom:6px;background:var(--panel2)}
.fr .fn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--acc);color:var(--acc-tx)}
.fr label{font-size:13px;display:flex;gap:5px;align-items:center;color:var(--mut)}
/* زرار الإجراءات السريعة */
.fab{position:fixed;z-index:25;inset-inline-end:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fb{width:56px;height:56px;border-radius:50%;border:0;cursor:pointer;font-size:28px;line-height:1;color:var(--acc-tx);background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 72%,var(--bg)));box-shadow:0 14px 30px -10px var(--acc);transition:transform .3s}
.fab.open .fb{transform:rotate(135deg)}
.fm{display:grid;gap:8px;opacity:0;transform:translateY(14px) scale(.96);pointer-events:none;transition:all .25s}
.fab.open .fm{opacity:1;transform:none;pointer-events:auto}
.fm button{display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:999px;background:var(--panel);border:1px solid var(--line);cursor:pointer;font-weight:600;box-shadow:0 10px 24px -14px rgba(0,0,0,.6)}
.fm button:hover{border-color:var(--acc)}
/* شاشة البداية */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s,visibility .5s}
#splash.x{opacity:0;visibility:hidden}
#splash .bm{width:68px;height:68px;font-size:24px;border-radius:20px;animation:spl 1.1s ease-in-out infinite}
@keyframes spl{50%{transform:scale(1.12) rotate(-4deg)}}
#splash u{width:120px;height:3px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
#splash u::after{content:"";position:absolute;inset:0;background:var(--acc);transform-origin:right;animation:ld .75s ease-out forwards}
@keyframes ld{from{transform:scaleX(0)}}
/* أماكن القائمة (للشاشات الكبيرة بس) */
@media (min-width:821px){
:root[data-sb="l"] .app{grid-template-columns:1fr 240px}
:root[data-sb="l"] aside{order:2;border-inline-end:0;border-inline-start:1px solid var(--line)}
:root[data-sb="m"] .app{grid-template-columns:84px 1fr}
:root[data-sb="m"] nav button{font-size:0;justify-content:center;padding:13px 0}
:root[data-sb="m"] nav button span{font-size:20px;width:auto}
:root[data-sb="m"] :is(.ng,.brt,.sbf){display:none}
:root[data-sb="m"] .brand{justify-content:center;padding:2px 0 14px}
:root[data-sb="m"] nav button.on::before{inset-inline-start:-14px}
:root[data-sb="m"] .nb{position:absolute;top:3px;inset-inline-end:8px;margin:0;min-width:16px;height:16px;font-size:10px}
:root[data-sb="t"] .app{grid-template-columns:1fr}
:root[data-sb="t"] aside{height:64px;flex-direction:row;align-items:center;padding:8px 14px;z-index:15;border-inline-end:0;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
:root[data-sb="t"] nav{display:flex;gap:4px}
:root[data-sb="t"] :is(.ng,.sbf){display:none}
:root[data-sb="t"] .brand{padding:0 8px 0 14px}
:root[data-sb="t"] nav button.on::before{display:none}
:root[data-sb="t"] .tb{top:64px}
}
@media (max-width:820px){
.brand,.ng,.sbf,.clk small,.tb .ib:first-child{display:none}
.dg{grid-template-columns:1fr}.tw{max-height:none}
.nb{margin-inline-start:6px}
}
@media (max-width:600px){
.fl{grid-template-columns:1fr!important}.skg{grid-template-columns:1fr}
.ov{align-items:end;padding:0}
.md{width:100%!important;border-radius:22px 22px 0 0;max-height:92vh;animation:sheet .35s cubic-bezier(.2,.8,.3,1)}
@keyframes sheet{from{transform:translateY(100%)}}
.clk{display:none}
}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><div class="bm">HR</div><div class="brt"><b>نظام الموارد البشرية</b><small>إدارة الموظفين والرواتب</small></div></div>
<nav id="nav"></nav><div class="sbf"><div class="sfu"><span class="av">م</span><div><b>مسؤول الموارد البشرية</b><small>HR Manager</small></div></div><button class="btn th" id="thm" onclick="toggleTheme()"></button></div>
</aside>
<div class="mw"><div class="tb" id="tb"></div><main id="main"></main></div>
</div>
<script>
/* ===== طبقة الداتا: هنبدّل Store بـ Firebase في الآخر ===== */
const Store={
 key:'hr_db_v1',
 load(){try{return JSON.parse(localStorage.getItem(this.key))}catch(e){return null}},
 save(d){try{localStorage.setItem(this.key,JSON.stringify(d))}catch(e){}}
};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fmt=n=>Number(n||0).toLocaleString('ar-EG');
let LATE='09:15';
function seed(){
 const dp=['الموارد البشرية','المبيعات','التقنية','المحاسبة','العمليات'];
 const E=(name,job,dept,salary,phone,hire)=>({id:uid(),name,job,dept,salary,phone,email:'',hire});
 return{departments:dp,att:{},leaves:[],pay:{},employees:[
  E('أحمد سمير','مدير موارد بشرية',dp[0],18000,'01000000001','2021-03-01'),
  E('منى عادل','مسؤول مبيعات',dp[1],12000,'01000000002','2022-06-15'),
  E('كريم حسن','مطور ويب',dp[2],20000,'01000000003','2023-01-10'),
  E('سارة محمود','محاسب',dp[3],14000,'01000000004','2020-09-20'),
  E('يوسف علي','مشرف عمليات',dp[4],11000,'01000000005','2024-02-05')]};
}
const CFG0={co:'',late:'09:15',start:'09:00',end:'17:00',hrs:8,wk:[5,6],annual:21,prob:90,lfree:3,lday:.25,otx:1.5,ins:11,minw:7000};
const DB0=()=>({recruits:[],reviews:[],docs:[],trn:[],ast:[],disc:[],ann:[],hol:[],snap:{},cfg:{}});
let db=Object.assign(DB0(),Store.load()||seed());
db.cfg=Object.assign({},CFG0,db.cfg);LATE=db.cfg.late;
const save=()=>Store.save(db);
let view='dash',attDate=today(),payMonth=today().slice(0,7),q='',qd='';
const VIEWS=[['dash','لوحة التحكم'],['emp','الموظفين'],['att','الحضور والانصراف'],['lv','الإجازات'],['pay','الرواتب'],['rec','التوظيف'],['perf','تقييم الأداء'],['doc','المستندات'],['dep','الأقسام'],['trn','التدريب'],['ast','العُهد والأصول'],['disc','المخالفات والجزاءات'],['ann','الإعلانات'],['rep','التقارير'],['set','الإعدادات']];
const emp=id=>db.employees.find(e=>e.id===id);
const ini=n=>esc((n||'?').trim()[0]);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function go(v){view=v;render()}
function render(){
 $('#nav').innerHTML=VIEWS.map(([k,n])=>`<button class="${k===view?'on':''}" onclick="go('${k}')"><span aria-hidden="true">${ICO[k]}</span>${n}</button>`).join('');
 const m=$('#main');m.innerHTML=({dash:vDash,emp:vEmp,att:vAtt,lv:vLv,pay:vPay,rec:vRec,perf:vPerf,doc:vDoc,dep:vDep,trn:()=>vMod('trn'),ast:()=>vMod('ast'),disc:()=>vMod('disc'),ann:()=>vMod('ann'),rep:vRep,set:vSet,ui:vUI,loan:vLoan,raise:vRaise,eos:vEos,ot:vOt,bon:vBon,wage:vWage,exp:vExp,bud:vBud,org:vOrg,chk:vChk,shift:vShift,users:vUsers,audit:vAudit})[view]();
 if(view!==lastView){m.classList.remove('pg');void m.offsetWidth;m.classList.add('pg');lastView=view}
 m.querySelectorAll('[data-p]').forEach(e=>setTimeout(()=>e.style.setProperty('--p',e.dataset.p),60));
 m.querySelectorAll('[data-w]').forEach(e=>setTimeout(()=>e.style.width=e.dataset.w,60));
 m.querySelectorAll('[data-n]').forEach(e=>{const n=+e.dataset.n,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/900);e.textContent=fmt(Math.round(n*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(f)})(t0)});
 paintTh();
}
function head(t,s,extra=''){return `<h1>${t}</h1><p class="sub">${s}</p>${extra}`}
/* ===== مودال ===== */
function modal(title,body,onSave){
 const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<div class="md" role="dialog" aria-label="${esc(title)}"><h2>${title}</h2><form>${body}<div class="act"><button type="button" class="btn" data-x>إلغاء</button><button class="btn pri">حفظ</button></div></form></div>`;
 document.body.appendChild(o);
 o.querySelector('[data-x]').onclick=()=>o.remove();
 o.addEventListener('mousedown',e=>{if(e.target===o)o.remove()});
 o.querySelector('form').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(onSave(d)!==false)o.remove()};
 const f=o.querySelector('input,select');f&&f.focus();
}
/* ===== لوحة التحكم ===== */
function vDash(){
  const t=today(),E=act();
 const pr=E.filter(e=>(db.att[t+'|'+e.id]||{}).in).length;
 const pct=E.length?Math.round(pr/E.length*100):0;
 const pend=db.leaves.filter(l=>l.status==='pending');
 const tot=E.reduce((s,e)=>s+ +e.salary,0);
 const ds=db.departments.map(d=>[d,E.filter(e=>e.dept===d).length]);
 const mx=Math.max(1,...ds.map(x=>x[1]));
 return head('لوحة التحكم','نظرة سريعة على اليوم')+
 `<div class="card hero"><div class="ring" style="--p:0" data-p="${pct}"><div>${pct}%<small>حضور اليوم</small></div></div>
  <div class="grid g4">
   <div class="stat"><b data-n="${E.length}">${fmt(E.length)}</b><span>إجمالي الموظفين</span></div>
   <div class="stat"><b data-n="${pr}">${fmt(pr)}</b><span>حاضرين النهارده</span></div>
   <div class="stat"><b data-n="${pend.length}">${fmt(pend.length)}</b><span>إجازات منتظرة الموافقة</span></div>
   <div class="stat"><b data-n="${tot}">${fmt(tot)}</b><span>إجمالي الرواتب الأساسية (ج.م)</span></div>
   <div class="stat"><b data-n="${db.recruits.filter(r=>r.stage<3).length}">0</b><span>مرشحين قيد التوظيف</span></div>
   <div class="stat"><b data-n="${db.docs.filter(d=>dState(d.exp)[1]!=='ok').length}">0</b><span>مستندات منتهية أو قربت تنتهي</span></div>
  </div></div>
  ${insightsCard()}<div class="two"><div class="card"><b>الموظفين حسب القسم</b>${ds.map(([d,n])=>`<div class="hb"><span>${esc(d)}</span><i style="width:0" data-w="${n/mx*60}%"></i><span>${fmt(n)}</span></div>`).join('')||'<div class="empty">مفيش أقسام لسه</div>'}</div>
 <div class="card"><b>آخر طلبات الإجازة</b>${db.leaves.slice(-5).reverse().map(l=>`<div class="hb"><span>${esc((emp(l.emp)||{}).name||'—')}</span><span>${esc(l.type)}</span><span class="tag ${LS[l.status][1]}">${LS[l.status][0]}</span></div>`).join('')||'<div class="empty">مفيش طلبات إجازة</div>'}</div></div>`;
}
/* ===== الموظفين ===== */
function vEmp(){
 const L=db.employees.filter(e=>(!qd||e.dept===qd)&&(!q||(e.name+e.job+e.phone).includes(q)));
 return head('الموظفين',`${fmt(db.employees.length)} موظف مسجّل`,
 `<div class="bar"><input class="in" placeholder="ابحث بالاسم أو الوظيفة أو الموبايل" value="${esc(q)}" oninput="q=this.value;rerenderTable()" style="min-width:240px">
 <select class="in" onchange="qd=this.value;rerenderTable()"><option value="">كل الأقسام</option>${db.departments.map(d=>`<option ${d===qd?'selected':''}>${esc(d)}</option>`).join('')}</select>
 <span class="sp"></span><button class="btn" onclick="csv('emp')">⬇ تصدير</button><button class="btn pri" onclick="empForm()">+ موظف جديد</button></div><div id="tb">${empTable(L)}</div>`);
}
function empTable(L){
 if(!L.length)return '<div class="card empty">مفيش موظفين مطابقين. اضغط «موظف جديد» عشان تضيف.</div>';
 return `<div class="tw"><table><tr><th>الموظف</th><th>الوظيفة</th><th>القسم</th><th>الموبايل</th><th>تاريخ التعيين</th><th>الراتب</th><th></th></tr>${L.map(e=>`<tr><td><span class="av">${ini(e.name)}</span><a href="#" onclick="prof('${e.id}');return false" style="color:inherit;font-weight:600">${esc(e.name)}</a>${e.st==='x'?' <span class="tag bad">منتهية خدمته</span>':''}</td><td>${esc(e.job)}</td><td>${esc(e.dept)}</td><td dir="ltr" style="text-align:right">${e.phone?`<a href="tel:${esc(e.phone)}" style="color:inherit">${fmtPh(e.phone)}</a>`:'—'}</td><td>${esc(e.hire)}</td><td>${fmt(e.salary)}</td><td><button class="btn sm" onclick="empForm('${e.id}')">تعديل</button> <button class="btn sm" onclick="${e.st==='x'?'reAct':'endForm'}('${e.id}')">${e.st==='x'?'إعادة تفعيل':'إنهاء خدمة'}</button> <button class="btn sm bad" onclick="empDel('${e.id}')">حذف</button></td></tr>`).join('')}</table></div>`;
}
function rerenderTable(){const L=db.employees.filter(e=>(!qd||e.dept===qd)&&(!q||(e.name+e.job+e.phone).includes(q)));$('#tb').innerHTML=empTable(L)}
function empForm(id,pre){
 const e=id?emp(id):{name:'',job:'',dept:db.departments[0]||'',salary:'',phone:'',email:'',hire:today(),...(pre||{})};
 modal(id?'تعديل موظف':'موظف جديد',`<div class="fl">
 <label class="w">الاسم<input class="in" name="name" required minlength="3" maxlength="40" data-k="txt" value="${esc(e.name)}"></label>
 <label>الوظيفة<input class="in" name="job" maxlength="40" data-k="txt" value="${esc(e.job)}"></label>
 <label>القسم<select class="in" name="dept">${db.departments.map(d=>`<option ${d===e.dept?'selected':''}>${esc(d)}</option>`).join('')}</select></label>
 <label>الموبايل<input class="in" name="phone" data-k="tel" inputmode="tel" maxlength="16" pattern="01[0125][0-9]{8}" title="موبايل مصري 11 رقم" value="${esc(e.phone)}"><small class="hint"></small></label>
 <label>الراتب الأساسي<input class="in" type="text" inputmode="numeric" data-k="money" name="salary" required value="${esc(e.salary)}"><small class="hint"></small></label>
 <label>البريد<input class="in" type="email" name="email" data-k="mail" inputmode="email" autocomplete="off" value="${esc(e.email)}"><small class="hint"></small></label>
 <label>الرقم القومي<input class="in" name="nid" data-k="nid" inputmode="numeric" maxlength="14" value="${esc(e.nid)}"><small class="hint"></small></label><label>تاريخ الميلاد<input class="in" type="date" name="birth" value="${esc(e.birth)}"></label><label>موبايل الطوارئ<input class="in" name="emg" data-k="tel" inputmode="tel" maxlength="16" value="${esc(e.emg)}"><small class="hint"></small></label><label>نوع التعاقد<select class="in" name="ctype">${['دوام كامل','دوام جزئي','عقد مؤقت','تحت التدريب'].map(x=>`<option ${x===e.ctype?'selected':''}>${x}</option>`).join('')}</select></label><label>تاريخ التعيين<input class="in" type="date" name="hire" max="${today()}" value="${esc(e.hire)}"></label></div>`,d=>{
  d.salary=+String(d.salary).replace(/[^\d.]/g,'');if(smartDup(id,d))return false;d.name=d.name.trim().replace(/\s+/g,' ');
  if(db.employees.some(x=>x.id!==id&&x.phone&&x.phone===d.phone)){toast('الموبايل ده مسجّل لموظف تاني');return false}
  if(id)Object.assign(emp(id),d);else db.employees.push({id:uid(),...d});
  save();render();toast('تم الحفظ');
 });
}
function empDel(id){
 if(!confirm('متأكد إنك عاوز تحذف الموظف ده؟ سجلاته هتتمسح كمان.'))return;
 db.employees=db.employees.filter(e=>e.id!==id);db.leaves=db.leaves.filter(l=>l.emp!==id);db.reviews=db.reviews.filter(r=>r.emp!==id);db.docs=db.docs.filter(d=>d.emp!==id);db.trn=db.trn.filter(x=>x.emp!==id);db.ast=db.ast.filter(x=>x.emp!==id);db.disc=db.disc.filter(x=>x.emp!==id);
 Object.keys(db.att).forEach(k=>{if(k.endsWith('|'+id))delete db.att[k]});
 save();render();toast('تم الحذف');
}
/* ===== الحضور ===== */
function status(r){if(!r)return['لم يُسجَّل',''];if(r.absent)return['غائب','bad'];if(!r.in)return['لم يُسجَّل',''];return r.in>LATE?['متأخر','warn']:['حاضر','ok']}
function vAtt(){
  const rows=act().map(e=>{const r=db.att[attDate+'|'+e.id]||{};const s=onLv(e.id,attDate)&&!r.in?['في إجازة','ok']:status(db.att[attDate+'|'+e.id]);
 return `<tr><td><span class="av">${ini(e.name)}</span>${esc(e.name)}</td><td>${esc(e.dept)}</td>
 <td><input class="in" type="time" value="${r.in||''}" onchange="attSet('${e.id}','in',this.value)"> <button class="btn sm" onclick="attNow('${e.id}','in')">الآن</button></td>
 <td><input class="in" type="time" value="${r.out||''}" onchange="attSet('${e.id}','out',this.value)"> <button class="btn sm" onclick="attNow('${e.id}','out')">الآن</button></td>
 <td><span class="tag ${s[1]}">${s[0]}</span>${hrsTag(r)}</td><td><button class="btn sm ${r.absent?'':'bad'}" onclick="attAbs('${e.id}')">${r.absent?'إلغاء الغياب':'غائب'}</button></td></tr>`}).join('');
 return head('الحضور والانصراف',`التأخير بعد الساعة ${LATE}${isWork(attDate)?'':' · اليوم ده إجازة (أسبوعية أو رسمية)'}`,

function toCsv(S){
 const q=v=>'"'+String(v).replace(/"/g,'""')+'"',L=[S.cols.map(c=>q(c.h)).join(',')];
 S.rows.forEach(r=>L.push(S.cols.map(c=>{let v=c.v(r);
  if(c.t==='money'||c.t==='num')return v===''||v==null?'':+v;
  v=v==null?'':String(v);if(!v)return '';
  return c.t==='id'?q('="'+v+'"'):q(/^[=+\-@]/.test(v)?"'"+v:v)}).join(',')));
 return '\ufeff'+L.join('\r\n');
}

function fbPack(D,pre,arr,isMap){
 const enc=new TextEncoder();let cur=[],sz=0,n=0;
 const out=()=>{if(cur.length){D[pre+'.'+n++]=JSON.stringify(isMap?Object.fromEntries(cur):cur);cur=[];sz=0}};
 for(const it of arr){const s=enc.encode(JSON.stringify(it)).length+4;if(cur.length&&sz+s>FCH)out();cur.push(it);sz+=s}
 out();
}
function fbSplit(d){
 const D={};
 for(const [k,v] of Object.entries(d)){
  if(v==null)continue;
  if(FMK[k]){const g={};for(const [kk,vv] of Object.entries(v)){const m=k==='snap'?kk:kk.slice(0,7);(g[m]=g[m]||[]).push([kk,vv])}for(const m in g)fbPack(D,'m.'+k+'.'+m,g[m],true)}
  else if(Array.isArray(v)){if(v.length)fbPack(D,'a.'+k,v,false)}
  else D['o.'+k]=JSON.stringify(v);
 }
 return D;
}
function fbJoin(D){
 const d=Object.assign(DB0(),{att:{},leaves:[],pay:{},departments:[],employees:[]});
 Object.keys(D).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).forEach(id=>{
  const p=id.split('.'),t=p[0],k=p[1];let v;try{v=JSON.parse(D[id])}catch(e){return}
  if(t==='o')d[k]=v;
  else if(t==='a')d[k]=(Array.isArray(d[k])?d[k]:[]).concat(v);
  else if(t==='m')d[k]=Object.assign(d[k]&&!Array.isArray(d[k])?d[k]:{},v);
 });
 return d;
}

  const s=await FX.Fs.getDocs(cr('users'));FUL=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.email||'').localeCompare(b.email||''));
  const el=document.getElementById('ul');if(!el)return;
  el.innerHTML=`<div class="tw"><table><tr><th>الاسم</th><th>البريد</th><th>الصلاحية</th><th></th></tr>${FUL.map(u=>{const me=u.id===FB.user.uid;return `<tr><td>${esc(u.name||'—')}${me?' <span class="tag ok">أنت</span>':''}</td><td dir="ltr" style="text-align:right">${esc(u.email||'')}</td><td>${me?esc(ROLES[u.role]||''):`<select class="in" onchange="userRole('${u.id}',this.value)">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${u.role===k?'selected':''}>${v}</option>`).join('')}</select>`}</td><td>${me?'':`<button class="btn sm bad" onclick="userDel('${u.id}')">إلغاء الوصول</button>`}</td></tr>`}).join('')}</table></div><div class="card" style="margin-top:14px"><small class="hint">مدير النظام: كل حاجة + المستخدمين + سجل العمليات. محرر: يضيف ويعدّل ويحذف. عرض فقط: يشوف من غير ما يعدّل. الصلاحيات دي مفروضة من قواعد فاير بيس نفسها.</small></div>`;
 }catch(e){box.innerHTML='<div class="card empty">تعذّر تحميل المستخدمين ('+esc(e.code||'')+')</div>'}
}
async function userCreate(d){
 const sec=FX.A.initializeApp(FBCFG,'sec'+Date.now());
 try{
  const a2=FX.Au.getAuth(sec),c=await FX.Au.createUserWithEmailAndPassword(a2,d.email.trim(),d.pw);
  await FX.Fs.setDoc(dr('users',c.user.uid),{role:d.role,email:d.email.trim().toLowerCase(),name:d.name.trim(),at:FX.Fs.serverTimestamp(),by:FB.user.uid});
  await FX.Au.signOut(a2);
 }finally{FX.A.deleteApp(sec).catch(()=>{})}
}
function userForm(){
 modal('مستخدم جديد',`<div class="fl"><label class="w">الاسم<input class="in" name="name" required maxlength="40" data-k="txt"></label><label class="w">البريد الإلكتروني<input class="in" type="email" name="email" required dir="ltr" data-k="mail" autocomplete="off"><small class="hint"></small></label><label>كلمة سر مؤقتة<input class="in" type="text" name="pw" required minlength="8" maxlength="40" dir="ltr" autocomplete="off"></label><label>الصلاحية<select class="in" name="role"><option value="editor">محرر</option><option value="viewer">عرض فقط</option><option value="admin">مدير النظام</option></select></label></div><small class="hint">بيدخل بالبريد وكلمة السر دي، وبعدين يغيّرها من «نسيت كلمة السر».</small>`,async d=>{
  try{await userCreate(d);toast('تم إنشاء حساب '+d.name.trim());usersLoad();return true}
  catch(e){toast({'auth/email-already-in-use':'البريد ده ليه حساب قبل كده. اطلب منه يدخل ويبعتلك الـUID، وبعدين استخدم «ربط حساب موجود»','auth/weak-password':'كلمة السر ضعيفة','auth/invalid-email':'البريد غير صحيح'}[e.code]||'تعذّر الإنشاء ('+(e.code||e.message)+')','bad');return false}
 });
}
function userLink(){
 modal('ربط حساب موجود',`<div class="fl"><label class="w">الاسم<input class="in" name="name" required maxlength="40" data-k="txt"></label><label class="w">البريد<input class="in" type="email" name="email" required dir="ltr" data-k="mail"><small class="hint"></small></label><label class="w">UID (بيظهر لصاحب الحساب في شاشة «حسابك لسه مش مفعّل»)<input class="in" name="uid" required minlength="20" maxlength="40" dir="ltr" autocomplete="off"></label><label>الصلاحية<select class="in" name="role"><option value="editor">محرر</option><option value="viewer">عرض فقط</option><option value="admin">مدير النظام</option></select></label></div>`,async d=>{
  try{await FX.Fs.setDoc(dr('users',d.uid.trim()),{role:d.role,email:d.email.trim().toLowerCase(),name:d.name.trim(),at:FX.Fs.serverTimestamp(),by:FB.user.uid});toast('تم ربط الحساب');usersLoad();return true}
  catch(e){toast('تعذّر الربط ('+(e.code||'')+')','bad');return false}
 });
}
async function userRole(id,r){
 if(r==='admin'&&!await ask({title:'ترقية لمدير',msg:'المدير يقدر يعمل كل حاجة ويضيف ويشيل مستخدمين. متأكد؟',ok:'ترقية',icon:'🔑'}))return usersLoad();
 try{await FX.Fs.updateDoc(dr('users',id),{role:r});toast('تم تغيير الصلاحية')}catch(e){toast('تعذّر التغيير ('+(e.code||'')+')','bad');usersLoad()}
}
async function userDel(id){
 const u=FUL.find(x=>x.id===id)||{};
 if(!await ask({title:'إلغاء وصول مستخدم',msg:`${u.name||u.email||'المستخدم'} مش هيقدر يدخل السيستم. (حساب الدخول نفسه بيفضل في Firebase Authentication، تقدر تمسحه من الـConsole).`,ok:'إلغاء الوصول',danger:1,icon:'🚫'}))return;
 try{await FX.Fs.deleteDoc(dr('users',id));toast('تم إلغاء الوصول');usersLoad()}catch(e){toast('تعذّر ('+(e.code||'')+')','bad')}
}
/* ===== سجل العمليات (مدير النظام بس) ===== */
function vAudit(){
 setTimeout(auditLoad,0);
 return head('سجل العمليات','آخر 150 عملية على البيانات، بالمستخدم والوقت',`<div class="bar"><span class="sp"></span><button class="btn" onclick="auditLoad()">تحديث</button></div>`)+'<div id="al"><div class="card empty">بنحمّل…</div></div>';
}
async function auditLoad(){
 const box=document.getElementById('al');if(!box)return;
 try{
  const s=await FX.Fs.getDocs(FX.Fs.query(cr('audit'),FX.Fs.orderBy('ts','desc'),FX.Fs.limit(150))),el=document.getElementById('al');if(!el)return;
  const L=s.docs.map(d=>d.data());
  el.innerHTML=L.length?`<div class="tw"><table style="min-width:760px"><tr><th>الوقت</th><th>المستخدم</th><th>العملية</th></tr>${L.map(a=>{const t=a.ts&&a.ts.toDate?a.ts.toDate().toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'}):'الآن';return `<tr><td>${esc(t)}</td><td dir="ltr" style="text-align:right">${esc(a.email||'')}</td><td style="white-space:normal">${(a.items||[]).map(x=>esc(x)).join('<br>')}</td></tr>`}).join('')}</table></div>`:'<div class="card empty">مفيش عمليات متسجلة لسه.</div>';
 }catch(e){box.innerHTML='<div class="card empty">تعذّر تحميل السجل ('+esc(e.code||'')+')</div>'}
}
if(FB.on)fbBoot();
render();
</script>
</body>
</html>
